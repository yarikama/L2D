[project]
name = "l2d"
version = "0.1.0"
description = "Learning to Dispatch for Job Shop Scheduling via Deep Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gym==0.17.3",
    "matplotlib",
    "numpy",
    "pydantic>=2.12.5",
    "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
l2d-train = "l2d.training.ppo:main"
